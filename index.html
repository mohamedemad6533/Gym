<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081522"><meta name="description" content="IRON TRACK workout and weight progress tracker">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>IRON TRACK</title>
<style>
:root{--bg:#091725;--panel:#14283c;--panel2:#1b344c;--blue:#0787d8;--blue2:#38b6ff;--muted:#9fb2c5;--line:#344b60;--green:#16c784}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f8fc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:28px}.hero{padding:28px 18px 24px;text-align:center;background:linear-gradient(135deg,#07111d,#12314e 65%,#0878bd);border-bottom:1px solid #24445f}.brand{font-size:clamp(30px,8vw,43px);font-weight:950;letter-spacing:1px}.brand span{color:var(--blue2)}.tag{color:#b7c8d8;font-size:13px}.slogan{font-weight:750;font-size:18px;margin:24px 0 0}.wrap{max-width:760px;margin:auto;padding:16px}.top-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 26px}.action{border:0;border-radius:18px;padding:15px;background:#20364b;color:white;font-size:17px;font-weight:800}.action.primary{background:var(--blue)}h2{font-size:20px;margin:18px 0 14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tab{background:#20364b;border:1px solid #435a70;border-radius:17px;color:#fff;padding:14px 5px;font-weight:800;font-size:17px}.tab small{display:block;color:#c0ceda;font-weight:500;font-size:12px;margin-top:5px}.tab.active{background:#087fc8;border-color:#56baff;box-shadow:0 0 0 1px #56baff}.dayhead{display:flex;justify-content:space-between;align-items:end;margin:24px 0 8px}.dayhead h1{font-size:27px;margin:0}.sub{color:var(--muted);font-size:14px}.progressline{height:9px;background:#2b4358;border-radius:10px;overflow:hidden;margin:12px 0 18px}.progressline i{display:block;height:100%;background:linear-gradient(90deg,#087fc8,#4bc4ff);width:0}.exercise{background:var(--panel);border:1px solid #3a536a;border-radius:22px;padding:13px;margin:13px 0;box-shadow:0 8px 20px #0002}.exhead{display:flex;align-items:center;gap:10px;margin-bottom:11px}.check{width:27px;height:27px;accent-color:#0a9be9;flex:none}.exname{font-size:18px;font-weight:850;flex:1}.num{background:#0787d8;border-radius:10px;padding:8px 12px;font-weight:900}.eximg{width:100%;height:190px;object-fit:cover;border-radius:15px;display:block;background:#263d51}.weights{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field label{display:block;color:#b5c7d8;font-size:12px;font-weight:750;margin-bottom:6px}.field input{width:100%;background:#0c1c2a;border:1px solid #52687b;color:white;border-radius:30px;padding:13px 14px;font-size:17px;outline:none;min-width:0}.field input:focus{border-color:var(--blue2)}.cardio,.savebox,.historybox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:18px 0}.cardio input{max-width:120px}.save{width:100%;border:0;background:var(--blue);color:white;padding:16px;border-radius:16px;font-size:17px;font-weight:850}.saved{color:#5be2a5;text-align:center;min-height:22px;margin-top:9px;font-size:13px}.historyitem{border:1px solid #344c62;border-radius:13px;padding:12px;margin:9px 0;background:#102337}.historyitem strong{display:block}.historyitem small{color:var(--muted)}.historyitem button{float:right;background:#203c56;color:#fff;border:1px solid #49647d;border-radius:9px;padding:7px}.empty{color:var(--muted);text-align:center;padding:22px}.hidden{display:none}.foot{text-align:center;color:#8299ad;font-size:12px;padding:16px}.backup{display:flex;gap:10px;flex-wrap:wrap}.backup button{flex:1;background:#20364b;color:#fff;border:1px solid #49647d;border-radius:12px;padding:12px;font-weight:700}@media(min-width:600px){.eximg{height:250px}.wrap{padding:22px}}
</style></head>
<body>
<header class="hero"><div class="brand">IRON <span>TRACK</span></div><div class="tag">YOUR PERSONAL WORKOUT TRACKER</div><div class="slogan">Track your weights. Build your strength.</div></header>
<main class="wrap">
<div class="top-actions"><button class="action" id="historyBtn">History (<span id="historyCount">0</span>) ◷</button><button class="action primary" id="workoutBtn">Workout ⚒</button></div>
<section id="workoutView"><h2>SELECT YOUR WORKOUT</h2><div class="tabs" id="tabs"></div><div class="dayhead"><div><div class="sub" id="daySub">Chest · Shoulders · Triceps</div><h1 id="dayTitle">PUSH DAY</h1></div><div style="text-align:right"><strong id="count">0/6</strong><div class="sub">COMPLETION</div></div></div><div class="progressline"><i id="progress"></i></div><div id="exerciseList"></div><section class="cardio"><div style="font-weight:850;font-size:18px">CARDIO</div><div class="sub">Target: 30 minutes</div><div class="field" style="margin-top:10px"><label for="cardio">CARDIO MINUTES</label><input id="cardio" type="number" min="0" max="300" inputmode="numeric" placeholder="30"></div></section><div class="savebox"><button class="save" id="saveBtn">SAVE TODAY'S WORKOUT</button><div class="saved" id="saveMessage"></div></div></section>
<section id="historyView" class="hidden"><h2>WORKOUT HISTORY</h2><div class="historybox"><div id="historyList"></div><div class="backup"><button id="exportBtn">Export backup</button><button id="importBtn">Import backup</button><input id="importFile" type="file" accept="application/json" hidden></div></div></section>
<div class="foot">Your workout data is saved on this device. Export a backup regularly.</div>
</main>
<script>
const workouts={
 PUSH:{sub:'Chest · Shoulders · Triceps',items:['Chest Press Flat','Fly Machine','Incline Bench Press','Front Raises','Cable Push Down','Overhead Extension'],imgs:[1,2,3,4,5,6]},
 PULL:{sub:'Back · Biceps',items:['Cross Lat Pulldown','Hammer Row','Seated Row','Hyper Extension','Lateral Raises','Delt Fly','Cable Curls','Hammer Curls'],imgs:[7,8,9,10,11,12,13,14]},
 LEGS:{sub:'Legs · Glutes · Calves',items:['Leg Extension','Hack Squat','Leg Press Machine','Leg Curl','Adductor Machine','Calves Raise'],imgs:[15,16,17,18,19,20]}
};
let day='PUSH',records=JSON.parse(localStorage.getItem('ironTrackRecords')||'[]'),draft={};
const $=id=>document.getElementById(id);const key=()=>new Date().toISOString().slice(0,10);
function saveDraft(){localStorage.setItem('ironTrackDraft',JSON.stringify({day,draft,cardio:$('cardio').value}));}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem('ironTrackDraft')||'{}');if(d.day===day){draft=d.draft||{};$('cardio').value=d.cardio||''}else{draft={};$('cardio').value=''}}catch{draft={}}}
function renderTabs(){$('tabs').innerHTML=Object.entries(workouts).map(([d,w])=>`<button class="tab ${d===day?'active':''}" data-day="${d}">${d==='PUSH'?'♧':d==='PULL'?'▣':'♧'}<br>${d}<small>${w.items.length} exercises</small></button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{saveDraft();day=b.dataset.day;loadDraft();render()})}
function render(){renderTabs();let w=workouts[day];$('dayTitle').textContent=day+' DAY';$('daySub').textContent=w.sub;$('exerciseList').innerHTML=w.items.map((name,i)=>{let v=draft[i]||{};return `<article class="exercise"><div class="exhead"><input class="check" type="checkbox" data-done="${i}" ${v.done?'checked':''} aria-label="Mark ${name} complete"><div class="exname">${name}</div><div class="num">${i+1}</div></div><img class="eximg" src="ex${String(w.imgs[i]).padStart(2,'0')}.jpg" alt="${name} exercise demonstration" loading="lazy"><div class="weights"><div class="field"><label>STARTED WEIGHT (KG)</label><input type="number" min="0" step="0.5" inputmode="decimal" placeholder="0" data-start="${i}" value="${v.start??''}"></div><div class="field"><label>FINISHED WEIGHT (KG)</label><input type="number" min="0" step="0.5" inputmode="decimal" placeholder="0" data-end="${i}" value="${v.end??''}"></div></div></article>`}).join('');document.querySelectorAll('[data-done]').forEach(e=>e.onchange=()=>{draft[e.dataset.done]={...(draft[e.dataset.done]||{}),done:e.checked};updateProgress();saveDraft()});document.querySelectorAll('[data-start]').forEach(e=>e.oninput=()=>{draft[e.dataset.start]={...(draft[e.dataset.start]||{}),start:e.value};saveDraft()});document.querySelectorAll('[data-end]').forEach(e=>e.oninput=()=>{draft[e.dataset.end]={...(draft[e.dataset.end]||{}),end:e.value};saveDraft()});$('cardio').oninput=saveDraft;updateProgress()}
function updateProgress(){let n=workouts[day].items.filter((_,i)=>draft[i]?.done).length;$('count').textContent=`${n}/${workouts[day].items.length}`;$('progress').style.width=(100*n/workouts[day].items.length)+'%'}
function saveWorkout(){const date=key();const entry={id:date+'-'+day+'-'+Date.now(),date,day,cardio:Number($('cardio').value||0),items:workouts[day].items.map((name,i)=>({name,start:draft[i]?.start||'',end:draft[i]?.end||'',done:!!draft[i]?.done}))};records.unshift(entry);localStorage.setItem('ironTrackRecords',JSON.stringify(records));$('saveMessage').textContent='Workout saved successfully ✓';renderHistoryCount()}
function renderHistoryCount(){$('historyCount').textContent=records.length}
function showHistory(){ $('workoutView').classList.add('hidden');$('historyView').classList.remove('hidden');renderHistory()}
function showWorkout(){ $('historyView').classList.add('hidden');$('workoutView').classList.remove('hidden')}
function renderHistory(){ $('historyList').innerHTML=records.length?records.map(r=>`<div class="historyitem"><button data-open="${r.id}">View</button><strong>${r.day} DAY · ${r.date}</strong><small>${r.items.filter(x=>x.done).length}/${r.items.length} completed · Cardio ${r.cardio} min</small></div>`).join(''):'<div class="empty">No saved workouts yet.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>viewRecord(b.dataset.open))}
function viewRecord(id){let r=records.find(x=>x.id===id);if(!r)return;let lines=r.items.map(x=>`${x.name}: start ${x.start||'—'} kg / finish ${x.end||'—'} kg ${x.done?'✓':''}`).join('\n');alert(`${r.day} · ${r.date}\nCardio: ${r.cardio} min\n\n${lines}`)}
$('historyBtn').onclick=showHistory;$('workoutBtn').onclick=showWorkout;$('saveBtn').onclick=saveWorkout;$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iron-track-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let imported=JSON.parse(await e.target.files[0].text());if(Array.isArray(imported)){records=[...imported,...records];localStorage.setItem('ironTrackRecords',JSON.stringify(records));renderHistoryCount();renderHistory();alert('Backup imported')}}catch{alert('Invalid backup file')}};
renderHistoryCount();loadDraft();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
